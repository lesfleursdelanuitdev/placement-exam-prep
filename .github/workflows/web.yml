name: Next.js app (web/)

# The Next.js port (NEXTJS-PLAN.md): the engine module and the plain page's tests against it,
# the exam model against app.js, typecheck, and the production build with its server tests and
# the pages in a browser (Playwright).
# A file of its own, so test.yml (the plain page's) merges from upstream untouched.
on:
  push:
    branches: [nextjs]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # signed-in progress (NEXTJS-PLAN.md S3-7): test/pg.mjs makes exam prep's roles and database here
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      EXAMPREP_TEST_PG: postgres://postgres:ci-only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Engine module
        run: node engine/build.mjs
      - name: The plain page's tests, against the module
        run: node engine/test/run-existing.mjs
      - name: Engine unit tests
        run: node --test engine/test/*.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: The built server
        run: |
          rm -rf release && mkdir release
          cp -a .next/standalone/. release/ && cp -a .next/static release/.next/static && cp -a db migrations release/
          node --test test/*.test.mjs
      - name: Playwright's browser
        run: npx playwright install --with-deps chromium
      - name: The pages in a browser
        run: npx playwright test
